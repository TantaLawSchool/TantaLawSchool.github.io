<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عرض بطاقات الدفع</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* استخدام خط Cairo لجمالية أفضل للعربية */
        body {
            font-family: 'Cairo', sans-serif;
            /* إضافة مساحة علوية لتجنب تداخل المحتوى مع الهيدر الثابت */
            padding-top: 190px; /* يمكن تعديل هذه القيمة حسب الحاجة */
        }
        @media (min-width: 640px) {
            body {
               padding-top: 160px;
            }
        }
        /* تخصيص شكل شريط التمرير */
        .custom-scrollbar::-webkit-scrollbar {
            height: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background-color: #1f2937; /* gray-800 */
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: #4b5563; /* gray-600 */
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background-color: #6b7280; /* gray-500 */
        }
        /* ستايل لتثبيت الهيدر */
        .sticky-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            width: 100%;
            background-color: #111827; /* bg-gray-900 */
            padding-bottom: 1rem;
            padding-top: 1rem;
        }
        /* ستايل لتمييز الصف المختار */
        .selected-row {
            background-color: #374151 !important; /* gray-700 */
        }
        .selected-row td {
            color: #ffffff;
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-200">

    <!-- قسم الإدخال في الأعلى (ثابت) -->
    <div class="sticky-header">
        <div class="container mx-auto px-4">
            <div class="bg-gray-800 p-4 sm:p-6 rounded-xl shadow-lg">
                <h1 class="text-2xl sm:text-3xl font-bold mb-4 text-center text-white">بيانات البطاقات</h1>
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                    <!-- حقل رقم البطاقة -->
                    <div class="flex flex-col">
                        <label for="cc-number" class="mb-1 text-sm font-semibold text-gray-400">رقم البطاقة</label>
                        <input id="cc-number" type="text" placeholder="xxxx xxxx xxxx xxxx" class="bg-gray-700 border border-gray-600 text-white rounded-lg p-2 focus:ring-2 focus:ring-blue-500 focus:outline-none" readonly>
                    </div>
                    <!-- حقول تاريخ الانتهاء -->
                    <div class="flex flex-col">
                        <label for="cc-month" class="mb-1 text-sm font-semibold text-gray-400">تاريخ الإنتهاء</label>
                        <div class="flex gap-2">
                            <input id="cc-month" type="text" placeholder="الشهر" class="w-1/2 bg-gray-700 border border-gray-600 text-white rounded-lg p-2 focus:ring-2 focus:ring-blue-500 focus:outline-none" readonly>
                            <input id="cc-year" type="text" placeholder="السنة" class="w-1/2 bg-gray-700 border border-gray-600 text-white rounded-lg p-2 focus:ring-2 focus:ring-blue-500 focus:outline-none" readonly>
                        </div>
                    </div>
                    <!-- حقل CVV -->
                    <div class="flex flex-col">
                        <label for="cc-cvv" class="mb-1 text-sm font-semibold text-gray-400">CVV</label>
                        <input id="cc-cvv" type="text" placeholder="xxx" class="bg-gray-700 border border-gray-600 text-white rounded-lg p-2 focus:ring-2 focus:ring-blue-500 focus:outline-none" readonly>
                    </div>
                    <div class="flex flex-col justify-end">
                         <button id="copy-button" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-lg w-full transition-colors duration-200">نسخ البيانات</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="container mx-auto p-4 max-w-7xl">
        <!-- حاوية الجدول لجعلها قابلة للتمرير أفقياً على الشاشات الصغيرة -->
        <div class="bg-gray-800 rounded-xl shadow-lg overflow-hidden">
            <div class="overflow-x-auto custom-scrollbar">
                <table class="w-full text-sm text-left text-gray-300 whitespace-nowrap">
                    <thead class="text-xs text-gray-300 uppercase bg-gray-700">
                        <tr>
                            <th scope="col" class="px-6 py-3">#</th>
                            <th scope="col" class="px-6 py-3">رقم البطاقة</th>
                            <th scope="col" class="px-6 py-3">الشهر</th>
                            <th scope="col" class="px-6 py-3">السنة</th>
                            <th scope="col" class="px-6 py-3">CVV</th>
                        </tr>
                    </thead>
                    <tbody id="cards-table-body">
                        <!-- سيتم إدراج صفوف البطاقات هنا بواسطة جافاسكريبت -->
                    </tbody>
                </table>
            </div>
        </div>
        <div class="text-center mt-4 text-xs text-gray-500">
            <p>تم عرض <span id="card-count">0</span> بطاقة.</p>
            <p class="mt-1">مرر الجدول أفقيًا على الشاشات الصغيرة لرؤية كافة البيانات.</p>
        </div>
    </div>

        let selectedRow = null; // متغير لتتبع الصف المختار حاليًا

        // دالة لتقسيم البيانات وعرضها في الجدول
        function populateTable() {
            const tableBody = document.getElementById('cards-table-body');
            const cardCountSpan = document.getElementById('card-count');
            
            // جلب حقول الإدخال مرة واحدة خارج الحلقة
            const ccNumberInput = document.getElementById('cc-number');
            const ccMonthInput = document.getElementById('cc-month');
            const ccYearInput = document.getElementById('cc-year');
            const ccCvvInput = document.getElementById('cc-cvv');

            const lines = cardData.trim().split('\n').filter(line => line.trim() !== '');
            let cardCounter = 0;

            lines.forEach((line, index) => {
                const parts = line.trim().split(/\s+/);
                
                if (parts.length >= 4) {
                    cardCounter++;
                    const [cardNumber, month, year, cvv] = parts;
                    const row = document.createElement('tr');
                    row.className = 'bg-gray-800 border-b border-gray-700 hover:bg-gray-600 transition-colors duration-200 cursor-pointer';

                    row.innerHTML = `
                        <td class="px-6 py-4 font-medium text-gray-400">${cardCounter}</td>
                        <td class="px-6 py-4 font-mono text-cyan-400">${cardNumber}</td>
                        <td class="px-6 py-4">${month}</td>
                        <td class="px-6 py-4">${year}</td>
                        <td class="px-6 py-4 text-amber-400">${cvv}</td>
                    `;

                    // إضافة حدث النقر على الصف
                    row.addEventListener('click', () => {
                        // إزالة التمييز من الصف المختار سابقًا
                        if (selectedRow) {
                            selectedRow.classList.remove('selected-row');
                        }

                        // تعيين بيانات الصف الحالي في حقول الإدخال
                        ccNumberInput.value = cardNumber;
                        ccMonthInput.value = month;
                        ccYearInput.value = year;
                        ccCvvInput.value = cvv;

                        // تمييز الصف الحالي
                        row.classList.add('selected-row');
                        selectedRow = row; // تحديث الصف المختار
                    });

                    tableBody.appendChild(row);
                }
            });
            
            cardCountSpan.textContent = cardCounter;
        }
        
        // دالة لنسخ البيانات - تم التعديل لإصلاح الخطأ
        function copyCardData() {
            const cardNumber = document.getElementById('cc-number').value;
            const month = document.getElementById('cc-month').value;
            const year = document.getElementById('cc-year').value;
            const cvv = document.getElementById('cc-cvv').value;

            if (!cardNumber) {
                showToast("الرجاء تحديد بطاقة أولاً!", true); // true for error
                return;
            }

            const textToCopy = `${cardNumber}|${month}|${year}|${cvv}`;
            
            // استخدام الطريقة القديمة الموثوقة التي تعمل في كل مكان
            const textArea = document.createElement("textarea");
            textArea.value = textToCopy;
            
            // جعل حقل النص غير مرئي وتجنب أي وميض أو تمرير للصفحة
            textArea.style.position = "fixed";
            textArea.style.top = "0";
            textArea.style.left = "0";
            textArea.style.width = "2em";
            textArea.style.height = "2em";
            textArea.style.padding = "0";
            textArea.style.border = "none";
            textArea.style.outline = "none";
            textArea.style.boxShadow = "none";
            textArea.style.background = "transparent";

            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();

            try {
                const successful = document.execCommand('copy');
                if (successful) {
                    showToast("تم نسخ البيانات بنجاح!");
                } else {
                    showToast("فشل نسخ البيانات.", true);
                }
            } catch (err) {
                console.error('فشل نسخ النص', err);
                showToast("حدث خطأ أثناء النسخ.", true);
            }

            document.body.removeChild(textArea);
        }
        
        // دالة لإظهار رسالة التأكيد - تم تعديلها لدعم رسائل الخطأ
        function showToast(message, isError = false) {
            const toast = document.getElementById('toast-notification');
            toast.textContent = message;
            
            // تغيير اللون في حالة وجود خطأ
            if (isError) {
                toast.classList.remove('bg-green-500');
                toast.classList.add('bg-red-500');
            } else {
                toast.classList.remove('bg-red-500');
                toast.classList.add('bg-green-500');
            }

            toast.classList.remove('opacity-0');
            setTimeout(() => {
                toast.classList.add('opacity-0');
            }, 2000); // إخفاء الرسالة بعد ثانيتين
        }


        // استدعاء الدالة عند تحميل الصفحة بالكامل
        document.addEventListener('DOMContentLoaded', () => {
             populateTable();
             document.getElementById('copy-button').addEventListener('click', copyCardData);
        });
    </script>
