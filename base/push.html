<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إضافة معلومات الفيلم</title>
    <style>
        /* --- Base Styles --- */
        body {
            font-family: Arial, sans-serif; direction: rtl; text-align: right; margin: 20px;
            background-color: #000; color: #fff;
        }
        .container {
            width: 90%; max-width: 800px; margin: auto; padding: 20px;
            border: 2px solid #fff; border-radius: 10px;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.1); background: none;
        }
        label {
            font-weight: bold; color: #ddd; display: block; margin-top: 15px;
        }
        input, select, textarea {
            width: 100%; padding: 10px; margin: 5px 0 10px 0;
            border: 1px solid #555; border-radius: 5px; background: #444;
            color: white; font-size: 16px; box-sizing: border-box;
        }
        input[type="text"][name$="_link[]"],
        input#reference-link {
             direction: ltr; text-align: left;
        }
        textarea { height: 100px; }
        .part-entry textarea[name="part_description[]"] {
            height: 100px; font-size: 14px;
        }
        button {
            color: white; border: none; padding: 10px 15px; cursor: pointer;
            border-radius: 5px; width: 100%; margin-top: 10px; font-size: 16px;
        }
        button:hover { opacity: 0.9; }
        #export { background: #28a745; }
        #export:hover { background: #218838; }
        #import { background: #ffd52d; color: black; }
        #import:hover { background: #ceab1e; }
        #add-part-btn {
            background: #007bff; width: auto; padding: 8px 12px;
            margin-top: 15px; display: block;
        }
        #add-part-btn:hover { background: #0056b3; }
        .remove-part-btn {
            background-color: #dc3545; width: auto; padding: 5px 10px;
            font-size: 12px; margin-right: 10px; margin-top: 0; float: left;
        }
        .remove-part-btn:hover { background-color: #c82333; }

        /* --- Container Styles --- */
        .genre-container, .type-container, .part-type-container, .reference-container, .reference-container-part {
            display: flex; flex-wrap: wrap; gap: 10px; justify-content: center;
            padding: 10px 0; border-bottom: 1px solid #444; margin-bottom: 15px;
        }
        .reference-container, .type-container { justify-content: flex-start; }
        .reference-container-part {
             border-bottom: none; padding: 5px 0 10px 0;
             margin-bottom: 5px; justify-content: flex-start;
        }

        /* --- Item Styles (Buttons) --- */
        .genre-item, .type-item, .part-type-item, .reference-item, .reference-item-part {
            display: flex; align-items: center; cursor: pointer; background: #444;
            padding: 8px 15px; border-radius: 20px;
            transition: background 0.3s, color 0.3s;
            color: #ddd; font-size: 14px;
        }
        .genre-item:hover, .type-item:hover, .part-type-item:hover, .reference-item:hover, .reference-item-part:hover {
            background: #666;
        }
        .genre-item input, .type-item input, .part-type-item input, .reference-item input, .reference-item-part input {
            display: none;
        }
        .genre-item.selected, .type-item.selected, .part-type-item.selected, .reference-item.selected, .reference-item-part.selected {
            background: #ffd52d; color: black; font-weight: bold;
        }
        .reference-item-part {
             padding: 6px 12px; font-size: 13px;
        }

        /* --- Section Styles --- */
        .seasons-container, #parts-number-container, #parts-section {
            display: none; margin-top: 20px; padding-top: 15px;
            border-top: 1px dashed #555;
        }
        .season-card, .part-entry {
            background: #222; padding: 15px; border-radius: 8px;
            margin-bottom: 10px; border: 1px solid #444; overflow: hidden;
        }
         .part-entry label {
              margin-top: 10px; font-size: 14px; color: #bbb;
         }
         .part-entry select, .part-entry input, .part-entry textarea {
              font-size: 14px; padding: 8px;
         }
         .part-entry h4 {
            margin-top: 0; margin-bottom: 15px; color: #ffd52d;
            border-bottom: 1px solid #444; padding-bottom: 5px;
         }
         .season-episode-count {
             font-size: 14px; padding: 8px;
         }

        /* --- Media Query --- */
        @media (min-width: 768px) {
            .container { max-width: 800px; }
            .genre-container, .type-container, .part-type-container, .reference-container, .reference-container-part {
                justify-content: flex-start;
            }
        }
    </style>
</head>
<body>
    <script>
        // Simple helper function
        function $(id){ return document.getElementById(id); }
        console.log("Helper function $ defined."); // Log helper definition
    </script>
    <div class="container">
        <h2>إضافة معلومات الفيلم أو المسلسل</h2>

        <canvas id="mainPoster" width="150" height="225" style="border: 1px solid #ffffff;" onclick="loadPoster()"></canvas>
        <input type="file" id="imageInput" accept="image/*" style="display: none;"/>

        <!-- Main Information Section -->
        <label>النوع:</label>
        <div class="type-container" id="type">
             <label class="type-item" data-value="Arabic-Movie"> فيلم عربي</label>
             <label class="type-item" data-value="Foreign-Movie"> فيلم أجنبي</label>
             <label class="type-item" data-value="Arabic-TVSeries"> مسلسل عربي</label>
             <label class="type-item" data-value="Foreign-TVSeries"> مسلسل أجنبي</label>
             <label class="type-item" data-value="Theatrical-Performance"> عرض مسرحي</label>
        </div>
        <label>المرجع الرئيسي:</label>
        <div class="reference-container" id="reference">
             <label class="reference-item" data-value="IMDB"> IMDB</label>
             <label class="reference-item" data-value="Elcinema"> Elcinema</label>
        </div>
        <label for="reference-link">رابط المرجع الرئيسي:</label>
        <input type="text" id="reference-link" placeholder="https://...">

        <label for="title">العنوان الرئيسي:</label>
        <input type="text" id="title">
        <label for="rating">التقييم الرئيسي:</label>
        <select id="rating"></select>
        <label for="year">سنة الإنتاج الرئيسية:</label>
        <select id="year"></select>
        <label>التصنيف (اختر حتى 3):</label>
        <div class="genre-container" id="genre">
            <!-- Genres populated by JS -->
        </div>
        <script>
            // This inline script populates genres. Ensure it runs AFTER the #genre div exists.
            console.log("Populating genres...");
            const genres_list_inline = ["Action","Adventure","Animation","Biography","Comedy","Crime","Documentary","Drama","Family","Fantasy","Film-Noir","History","Horror","Music","Musical","Mystery","Romance","Sci-Fi","Short","Sport","Thriller","War","Western"];
            const en_ar_dic_inline = {"Action":"أكشن","Adventure":"مغامرة","Animation":"رسوم متحركة","Biography":"سيرة ذاتية","Comedy":"كوميدى","Crime":"جريمة","Documentary":"وثائقى","Drama":"دراما","Family":"عائلى","Fantasy":"خيال","Film-Noir":"Film-Noir","History":"تاريخ","Horror":"رعب","Music":"موسيقى","Musical":"موسيقي","Mystery":"لغز","Romance":"رومانسى","Sci-Fi":"خيال علمى","Short":"قصير","Sport":"رياضة","Thriller":"اثارة","War":"حرب","Western":"غرب أمريكى"};
            function translate_inline(k){ if(k in en_ar_dic_inline){ return en_ar_dic_inline[k]; } else { return k; } }
            const genreContainerElement_inline = document.getElementById("genre"); // Use getElementById here
            if (genreContainerElement_inline) {
                for (const genreValue of genres_list_inline ){
                     const tempE = document.createElement('label');
                     tempE.className = 'genre-item';
                     tempE.dataset.value = genreValue;
                     tempE.textContent = translate_inline(genreValue);
                     genreContainerElement_inline.appendChild(tempE);
                 }
                 console.log("Genres populated.");
            } else {
                console.error("#genre container not found when trying to populate!");
            }
        </script>
        <label for="description">الوصف الرئيسي:</label>
        <textarea id="description"></textarea>

        <!-- Section for TV Series Seasons (Initially Hidden) -->
        <div id="seasons-section" class="seasons-container">
             <h3>تفاصيل المواسم</h3>
             <label for="seasons">عدد المواسم:</label>
             <select id="seasons"></select>
             <div id="season-cards"></div>
        </div>

        <!-- Section for Movie Parts (Initially Hidden) -->
        <div id="parts-number-container">
             <label>هل الفيلم جزء واحد أم عدة أجزاء؟</label>
             <div id="part-type-container" class="part-type-container">
                 <label class="part-type-item" data-value="single">جزء واحد</label>
                 <label class="part-type-item" data-value="multiple">عدة أجزاء</label>
             </div>
             <div id="parts-section">
                  <h3>تفاصيل الأجزاء</h3>
                  <div id="parts-container"></div>
                  <button type="button" id="add-part-btn">إضافة جزء جديد</button>
             </div>
        </div>

        <!-- Action Buttons -->
        <button id="export" onclick="exportJSON()">تصدير كـ JSON</button>
        <button id="import" onclick="importJSON()">استيراد Import</button>
        <input type="file" id="fileInput" accept=".json" style="display: none;" />
    </div>

    <!-- Hidden Template for a single Movie Part -->
    <div id="part-template" style="display: none;">
        <div class="part-entry">
             <button type="button" class="remove-part-btn">إزالة</button>
             <h4>الجزء <span class="part-number">{N}</span></h4>

             <canvas id="subPoster" width="150" height="225" style="border: 1px solid #ffffff;" onclick="loadSubPoster(this)"></canvas>
             <input type="file" id="subImageInput" onclick="this.value = '';" onchange="changeSubImageInput(this,event);" accept="image/*" style="display: none;"/>

             <label>اسم الجزء:</label>
             <input type="text" name="part_title[]" placeholder="مثال: الجزء الثاني: العودة">
             <label>مرجع الجزء:</label>
             <div class="reference-container-part">
                 <label class="reference-item-part" data-value="IMDB">IMDB</label>
                 <label class="reference-item-part" data-value="Elcinema">Elcinema</label>
             </div>
             <input type="hidden" name="part_reference[]">
             <label>رابط مرجع الجزء:</label>
             <input type="text" name="part_reference_link[]" placeholder="https://...">
             <label>تقييم الجزء:</label>
             <select name="part_rating[]" class="part-rating-select"></select>
             <label>سنة إنتاج الجزء:</label>
             <select name="part_year[]" class="part-year-select"></select>
             <label>وصف الجزء (اختياري):</label>
             <textarea name="part_description[]" rows="2" placeholder="وصف مختصر للجزء..."></textarea>
        </div>
    </div>

    <!-- Main JavaScript Logic -->
    <script>
        console.log("Main script executing..."); // Log script start

        // --- Element References ---
        // Ensure DOM is ready, or place this script at the end of <body>
        const typeContainer = $('type');
        const referenceContainer = $('reference');
        const genreContainer = $('genre'); // Get #genre again for the main script
        const seasonsSection = $('seasons-section');
        const partsNumberContainer = $('parts-number-container');
        const partTypeContainer = $('part-type-container');
        const partsSection = $('parts-section');
        const partsContainer = $('parts-container');
        const addPartBtn = $('add-part-btn');
        const partTemplate = $('part-template');
        const seasonsSelect = $('seasons');
        const seasonCardsContainer = $('season-cards');
        let partCounter = 0;

        console.log("Element references obtained.");

        // --- Pre-populate Template Dropdowns ---
        function populateTemplateDropdowns() {
            console.log("Populating template dropdowns...");
            const templateRatingSelect = partTemplate.querySelector('.part-rating-select');
            const templateYearSelect = partTemplate.querySelector('.part-year-select');

            if (!templateRatingSelect || !templateYearSelect) {
                console.error("Template dropdowns not found!");
                return;
            }

            // Populate Template Rating Dropdown
            templateRatingSelect.innerHTML = ''; // Clear existing options first
            let defaultRatingOption = document.createElement('option');
            defaultRatingOption.value = ""; defaultRatingOption.textContent = "-- اختر --";
            templateRatingSelect.appendChild(defaultRatingOption);
            for (let i = 10; i >= 1; i -= 0.1) {
                let option = document.createElement('option');
                let val = i.toFixed(1); option.value = val; option.textContent = val;
                templateRatingSelect.appendChild(option);
             }

            // Populate Template Year Dropdown
            templateYearSelect.innerHTML = ''; // Clear existing options first
            let defaultYearOption = document.createElement('option');
            defaultYearOption.value = ""; defaultYearOption.textContent = "-- اختر --";
            templateYearSelect.appendChild(defaultYearOption);
            const currentYear = new Date().getFullYear();
            for (let year = currentYear + 2; year >= 1914; year--) {
                let option = document.createElement('option');
                option.value = year; option.textContent = year;
                templateYearSelect.appendChild(option);
            }
            console.log("Template dropdowns populated.");
        }

        // --- Helper Functions to Populate Main Dropdowns ---
        function populateMainYearDropdown() {
             const yearSelect = $('year');
             if (!yearSelect) { console.error("#year select not found"); return; }
             yearSelect.innerHTML = ''; // Clear first
             let defaultOption = document.createElement('option');
             defaultOption.value = ""; defaultOption.textContent = "-- اختر --";
             yearSelect.appendChild(defaultOption);
             const currentYear = new Date().getFullYear();
             for (let year = currentYear + 2; year >= 1914; year--) {
                 let option = document.createElement('option');
                 option.value = year; option.textContent = year;
                 yearSelect.appendChild(option);
             }
             console.log("Main year dropdown populated.");
        }

        function populateMainRatingDropdown() {
            const ratingSelect = $('rating');
            if (!ratingSelect) { console.error("#rating select not found"); return; }
            ratingSelect.innerHTML = ''; // Clear first
            let defaultOption = document.createElement('option');
            defaultOption.value = ""; defaultOption.textContent = "-- اختر --";
            ratingSelect.appendChild(defaultOption);
            for (let i = 10; i >= 1; i -= 0.1) {
                let option = document.createElement('option');
                let val = i.toFixed(1); option.value = val; option.textContent = val;
                ratingSelect.appendChild(option);
            }
            console.log("Main rating dropdown populated.");
        }

        function populateSeasonsDropdown() {
            if (!seasonsSelect) { console.error("#seasons select not found"); return; }
            seasonsSelect.innerHTML = '';
            for (let i = 1; i <= 30; i++) {
                let option = document.createElement('option');
                option.value = i; option.textContent = i;
                seasonsSelect.appendChild(option);
            }
            seasonsSelect.value = "1";
            console.log("Seasons dropdown populated.");
        }

        // --- Function to Generate Season Input Cards ---
        function generateSeasonCards() {
             if (!seasonsSelect || !seasonCardsContainer) return; // Safety check
             const seasonCount = parseInt(seasonsSelect.value) || 0;
             console.log(`Generating ${seasonCount} season cards.`);
             seasonCardsContainer.innerHTML = '';
             for (let i = 1; i <= seasonCount; i++) {
                 let card = document.createElement('div');
                 card.className = 'season-card';
                 card.dataset.seasonNumber = i;
                 card.innerHTML = `<label for="season-ep-${i}">الموسم ${i} - عدد الحلقات:</label>
                                   <input type='number' id="season-ep-${i}" min='0' placeholder='مثال: 10' class='season-episode-count'>`;
                 seasonCardsContainer.appendChild(card);
             }
         }

        // --- Functions for Adding/Managing Movie Parts ---
        function addPartFields() {
             console.log("Adding new part fields...");
             partCounter++;
             if (!partTemplate) { console.error("#part-template not found!"); return;}
             const newPart = partTemplate.firstElementChild.cloneNode(true);

             newPart.querySelector('.part-number').textContent = partCounter;

             // Set unique IDs (Optional)
             const partIdSuffix = `-part${partCounter}`;
             // ... (ID setting logic - kept concise for clarity) ...

             // Clear default/cloned values
             newPart.querySelector('input[name="part_title[]"]').value = "";
             newPart.querySelector('input[name="part_reference[]"]').value = "";
             newPart.querySelector('input[name="part_reference_link[]"]').value = "";
             newPart.querySelectorAll('.reference-item-part.selected').forEach(btn => btn.classList.remove('selected'));
             newPart.querySelector('select[name="part_rating[]"]').value = "";
             newPart.querySelector('select[name="part_year[]"]').value = "";
             newPart.querySelector('textarea[name="part_description[]"]').value = "";

             if (!partsContainer) { console.error("#parts-container not found!"); return; }
             partsContainer.appendChild(newPart);
             console.log(`Part ${partCounter} added.`);
         }

        // --- Event Listeners ---
        console.log("Attaching event listeners...");

        // Genre Selection
        if (genreContainer) {
            genreContainer.addEventListener('click', (event) => {
                if (event.target.classList.contains('genre-item')) {
                    console.log("Genre item clicked:", event.target.dataset.value); // Log click
                    const label = event.target;
                    const selectedCount = genreContainer.querySelectorAll('.genre-item.selected').length;
                    if (!label.classList.contains('selected') && selectedCount >= 3) {
                        alert('يمكنك اختيار 3 تصنيفات بحد أقصى.');
                        event.preventDefault();
                        return;
                    }
                    label.classList.toggle('selected');
                }
            });
            console.log("Genre listener attached.");
        } else { console.error("#genre container not found for listener."); }

        // Main Reference Selection
        if (referenceContainer) {
            referenceContainer.addEventListener('click', (event) => {
                if (event.target.classList.contains('reference-item')) {
                     console.log("Main reference item clicked:", event.target.dataset.value);
                    referenceContainer.querySelectorAll('.reference-item').forEach(el => el.classList.remove('selected'));
                    event.target.classList.add('selected');
                }
            });
            console.log("Main reference listener attached.");
        } else { console.error("#reference container not found for listener."); }

        // Part Type Selection (Single/Multiple)
        if (partTypeContainer) {
             partTypeContainer.addEventListener('click', (event) => {
                 if (event.target.classList.contains('part-type-item')) {
                    console.log("Part type item clicked:", event.target.dataset.value);
                     const label = event.target;
                     partTypeContainer.querySelectorAll('.part-type-item').forEach(el => el.classList.remove('selected'));
                     label.classList.add('selected');
                     if (label.dataset.value === "multiple") {
                        if(partsSection) partsSection.style.display = 'block';
                         if (partsContainer && partsContainer.children.length === 0) {
                             addPartFields();
                         }
                     } else {
                        if(partsSection) partsSection.style.display = 'none';
                        if(partsContainer) partsContainer.innerHTML = '';
                         partCounter = 0;
                     }
                 }
            });
            console.log("Part type listener attached.");
        } else { console.error("#part-type-container not found for listener."); }


        // Main Type Selection (Movie/TVSeries)
        if (typeContainer) {
            typeContainer.addEventListener('click', (event) => {
                if (event.target.classList.contains('type-item')) {
                    console.log("Type item clicked:", event.target.dataset.value); // Log click
                    const label = event.target;
                    typeContainer.querySelectorAll('.type-item').forEach(el => el.classList.remove('selected'));
                    label.classList.add('selected');
                    const typeValue = label.dataset.value;

                    // Show/Hide Sections - Add null checks for elements
                    const displaySeasons = typeValue.includes('TVSeries');
                    const displayParts = typeValue.includes('Movie');

                    if (seasonsSection) seasonsSection.style.display = displaySeasons ? 'block' : 'none';
                    if (partsNumberContainer) partsNumberContainer.style.display = displayParts ? 'block' : 'none';
                    if (partsSection) partsSection.style.display = 'none'; // Always hide dynamic parts initially on type change

                    if (displaySeasons) {
                        if (partsContainer) partsContainer.innerHTML = ''; // Clear parts if switching to series
                         partCounter = 0;
                         if(partTypeContainer) partTypeContainer.querySelectorAll('.part-type-item').forEach(el => el.classList.remove('selected'));
                        generateSeasonCards(); // Generate season cards
                    }
                    if (displayParts) {
                        if (seasonCardsContainer) seasonCardsContainer.innerHTML = ''; // Clear seasons if switching to movie
                        if (seasonsSelect && seasonsSelect.options.length > 0) seasonsSelect.value = "1";
                         if(partTypeContainer) partTypeContainer.querySelectorAll('.part-type-item').forEach(el => el.classList.remove('selected')); // Reset part type
                         if (partsContainer) partsContainer.innerHTML = ''; // Clear parts container too
                         partCounter = 0;
                    }
                }
            });
            console.log("Type listener attached.");
        } else { console.error("#type container not found for listener."); }

        // Add Part Button Click
        if (addPartBtn) {
            addPartBtn.addEventListener('click', addPartFields);
            console.log("Add part button listener attached.");
        } else { console.error("#add-part-btn not found for listener."); }

        // Event Delegation on Parts Container
        if (partsContainer) {
            partsContainer.addEventListener('click', function(event) {
                // Handle Remove Button Click
                if (event.target.classList.contains('remove-part-btn')) {
                     console.log("Remove part button clicked.");
                    const partToRemove = event.target.closest('.part-entry');
                    if (partToRemove) { partToRemove.remove(); }
                }
                // Handle Per-Part Reference Button Click
                else if (event.target.classList.contains('reference-item-part')) {
                      console.log("Part reference item clicked:", event.target.dataset.value);
                      const clickedLabel = event.target;
                      const partEntry = clickedLabel.closest('.part-entry');
                      if (!partEntry) return; // Safety check
                      const referenceContainerPart = clickedLabel.closest('.reference-container-part');
                      const hiddenInput = partEntry.querySelector('input[name="part_reference[]"]');
                      if (!referenceContainerPart || !hiddenInput) return; // Safety check
                      referenceContainerPart.querySelectorAll('.reference-item-part').forEach(label => label.classList.remove('selected'));
                      clickedLabel.classList.add('selected');
                      hiddenInput.value = clickedLabel.dataset.value;
                 }
            });
            console.log("Parts container listener attached.");
        } else { console.error("#parts-container not found for listener."); }

        // Season Dropdown Change
        if (seasonsSelect) {
            seasonsSelect.addEventListener('change', generateSeasonCards);
            console.log("Seasons select listener attached.");
        } else { console.error("#seasons select not found for listener."); }

        console.log("Event listeners attachment process completed.");

        // --- JSON Export Logic ---
        function start_export(jsObj){
            console.log("Starting JSON export download...");
             const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(jsObj, null, 2));
             const downloadAnchor = document.createElement('a');
             downloadAnchor.setAttribute("href", dataStr);
             const safeTitle = (jsObj.title || 'export').replace(/[^a-z0-9\u0600-\u06FF_-]/gi, '_').toLowerCase();
             downloadAnchor.setAttribute("download", `${safeTitle}.json`);
             document.body.appendChild(downloadAnchor);
             downloadAnchor.click();
             downloadAnchor.remove();
             console.log("Export download triggered.");
         }

        function exportJSON() {
            console.log("exportJSON function called.");
            // --- Gather Main Information ---
            const selectedTypeLabel = typeContainer ? typeContainer.querySelector('.type-item.selected') : null;
            const selectedReferenceLabel = referenceContainer ? referenceContainer.querySelector('.reference-item.selected') : null;
            const selectedGenreLabels = genreContainer ? genreContainer.querySelectorAll('.genre-item.selected') : []; // Default to empty array
            const selectedPartTypeLabel = partTypeContainer ? partTypeContainer.querySelector('.part-type-item.selected') : null;

            const type = selectedTypeLabel ? selectedTypeLabel.dataset.value : null;
            const mainReference = selectedReferenceLabel ? selectedReferenceLabel.dataset.value : null;
            const mainReferenceLink = $('reference-link') ? $('reference-link').value.trim() : '';
            const title = $('title') ? $('title').value.trim() : '';
            const mainRating = $('rating') ? $('rating').value : '';
            const mainYear = $('year') ? $('year').value : '';
            const genres = Array.from(selectedGenreLabels).map(el => el.dataset.value);
            const description = $('description') ? $('description').value.trim() : '';

            console.log("Main data gathered:", {type, mainReference, title, mainRating, mainYear, genres: genres.length});

            // --- Validation ---
            let errors = [];
            if (!type) errors.push("الرجاء اختيار النوع.");
            if (!mainReference) errors.push("الرجاء اختيار المرجع الرئيسي.");
            if (!mainReferenceLink) errors.push("الرجاء إدخال رابط المرجع الرئيسي.");
            if (!title) errors.push("الرجاء إدخال العنوان الرئيسي.");
            if (!mainRating) errors.push("الرجاء اختيار التقييم الرئيسي.");
            if (!mainYear) errors.push("الرجاء اختيار سنة الإنتاج الرئيسية.");
            if (genres.length === 0) errors.push("الرجاء اختيار تصنيف واحد على الأقل.");
            // if (genres.length > 3) errors.push("الرجاء اختيار 3 تصنيفات بحد أقصى."); // Already handled by listener
            if (!description) errors.push("الرجاء إدخال الوصف الرئيسي.");

            let outputData = null;

            // --- Process based on Type ---
            if (type && type.includes('Movie')) {
                 console.log("Processing as Movie...");
                 const isMultiPart = selectedPartTypeLabel && selectedPartTypeLabel.dataset.value === 'multiple';
                 if (!selectedPartTypeLabel) {
                     errors.push("للفيلم: الرجاء تحديد ما إذا كان جزء واحد أم عدة أجزاء.");
                 }
                 let partsData = [];
                 if (isMultiPart && partsContainer) {
                     const partEntries = partsContainer.querySelectorAll('.part-entry');
                     console.log(`Found ${partEntries.length} part entries.`);
                     if (partEntries.length === 0) {
                         errors.push("للفيلم متعدد الأجزاء: الرجاء إضافة تفاصيل جزء واحد على الأقل.");
                     } else {
                         partEntries.forEach((partEntry, index) => {
                             const partNum = index + 1;
                             const partTitle = partEntry.querySelector('input[name="part_title[]"]').value.trim();
                             const partRef = partEntry.querySelector('input[name="part_reference[]"]').value;
                             const partRefLink = partEntry.querySelector('input[name="part_reference_link[]"]').value.trim();
                             const partRating = partEntry.querySelector('select[name="part_rating[]"]').value;
                             const partYear = partEntry.querySelector('select[name="part_year[]"]').value;
                             const partDescription = partEntry.querySelector('textarea[name="part_description[]"]').value.trim();

                             if (!partTitle) errors.push(`الجزء ${partNum}: الرجاء إدخال اسم الجزء.`);
                             if (!partRef) errors.push(`الجزء ${partNum}: الرجاء اختيار مرجع.`);
                             if (!partRefLink) errors.push(`الجزء ${partNum}: الرجاء إدخال رابط المرجع.`);
                             if (!partRating) errors.push(`الجزء ${partNum}: الرجاء اختيار التقييم.`);
                             if (!partYear) errors.push(`الجزء ${partNum}: الرجاء اختيار سنة الإنتاج.`);

                             partsData.push({ part: partNum, poster:partEntry.querySelector('canvas').toDataURL('image/png'), title: partTitle, description: partDescription, reference: partRef, referenceLink: partRefLink, rating: partRating, year: partYear });
                         });
                     }
                 }
                 if (errors.length === 0) {
                     outputData = { poster:$("mainPoster").toDataURL('image/png'), type: type, title: title, description: description, rating: mainRating, year: mainYear, genre: genres, mainReference: mainReference, mainReferenceLink: mainReferenceLink, isMultiPart: isMultiPart, parts: partsData };
                 }

            } else if(type && type.includes('Theatrical-Performance')){
                console.log("Processing as Theatrical-Performance...");
                if (errors.length === 0){
                    outputData = { poster:$("mainPoster").toDataURL('image/png'), type: type, title: title, description: description, rating: mainRating, year: mainYear, genre: genres, mainReference: mainReference, mainReferenceLink: mainReferenceLink};
                }
                
            }else if (type && type.includes('TVSeries')) {
                console.log("Processing as TVSeries...");
                 const seasonsCount = seasonsSelect ? parseInt(seasonsSelect.value) || 0 : 0;
                 const seasonCards = seasonCardsContainer ? seasonCardsContainer.querySelectorAll('.season-card') : [];
                 let seasonEpisodes = {};
                  if (seasonCards.length !== seasonsCount) {
                      errors.push("عدد بطاقات المواسم لا يطابق العدد المختار. حاول تغيير عدد المواسم وتصدير مرة أخرى.");
                  } else {
                     seasonCards.forEach(card => {
                         const seasonNum = card.dataset.seasonNumber;
                         const episodeCountInput = card.querySelector('.season-episode-count');
                         const episodes = episodeCountInput ? episodeCountInput.value.trim() : '';
                         if (episodes === "" || !/^\d+$/.test(episodes) || parseInt(episodes) < 0) {
                              errors.push(`الموسم ${seasonNum}: يرجى إدخال عدد حلقات صحيح (رقم موجب أو صفر).`);
                         }
                         seasonEpisodes[seasonNum] = episodes;
                     });
                  }
                  if (errors.length === 0) {
                     outputData = { poster:$("mainPoster").toDataURL('image/png'), type: type, title: title, description: description, rating: mainRating, year: mainYear, genre: genres, mainReference: mainReference, mainReferenceLink: mainReferenceLink, seasonsCount: seasonsCount, seasonEpisodes: seasonEpisodes };
                  }
            }

            // --- Final Action: Export or Show Errors ---
            if (errors.length > 0) {
                 console.warn("Validation errors:", errors);
                 alert("الرجاء تصحيح الأخطاء التالية:\n- " + errors.join("\n- "));
             } else if (outputData) {
                 console.log("Validation successful. Exporting data:", outputData);
                 start_export(outputData);
             } else {
                 console.error("Export failed. Output data is null and no errors were recorded.");
                 alert("حدث خطأ غير متوقع. لم يتم تحديد نوع المحتوى أو حدث خطأ في التحقق.");
             }
        }

                        parseData(jsonData);
                    } catch (error) {
                        alert("خطأ في تحليل الملف: " + error.message);

                };

                reader.onerror = function() {
                    alert("حدث خطأ أثناء قراءة الملف.");
                };

                // قراءة محتوى الملف
                reader.readAsText(file);
            } else {
                alert("الرجاء اختيار ملف JSON.");
