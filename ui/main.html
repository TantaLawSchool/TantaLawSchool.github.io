        <script>

            var request_result_status ;
            function isOk(){if(request_result_status==200){return true;}else{return false;}}
            var index_data;
            var page = 0;
            var pages_count;


            fetch("/data/index.json")
            .then( (resp) => resp.json() )
            .then( (data) => {

                request_result_status = 200;
                
                let index_element = document.createElement("script");
                index_element.type = "application/json";
                index_element.id = "index";
                index_element.textContent = JSON.stringify(data);
                document.body.appendChild(index_element);

                index_data = JSON.parse($("index").textContent);
            
                
                pages_count = Number( index_data["entry-info"]["pages-count"] );
                

            })
            .catch( (err) => {
                console.log(err);
            });

            

            const renderPage = (items) => {
                if(items && items.length > 0){
                    items.map( (item) => {
                        let {type, imdbId , name , year , rate , genres} = item;
                        const tempElement = document.createElement('div');
                        tempElement.setAttribute('class','card');
                        tempElement.innerHTML=`
                        <img src="/data/media/${imdbId}.jpg"></img>
                        <div class="name">${ ((name.length>10) ? name.slice(0, 10) + ".." : name) }</div>
                        <div class="year">${year}</div>
                        `;
                        $("root").appendChild(tempElement);

                    });

                }

            }

            const getSpecificPage = (pageNumber) => {

                renderPage(index_data["page"][pageNumber]);

            }

            const loadMore = (e) => {
                if (page<pages_count){
                    getSpecificPage(page);
                    page ++;
                }
                else{
                    console.log("No more pages.");
                }
            }


            const detectEndAndLoadMore = (e) => {
                scrollHeight = $("main").scrollHeight;
                scrollTop = $("main").scrollTop;
                clientHeight = $("main").clientHeight;

                //console.log(`main scrollHeight: ${scrollHeight}`);
                //console.log(`main scrollTop: ${scrollTop}`);
                //console.log(`main clientHeight: ${clientHeight}`);
                if( (scrollHeight-scrollTop) ==clientHeight){
                    /* load more */
                    console.log("end detected.");
                    if (isOk()){
                        loadMore();
                    }else{
                        console.log("index data has not fetched.");
                    }

                }
            }

            $("main").addEventListener("scroll",detectEndAndLoadMore);
            
        </script>

    <script>



       

        const can = document.createElement('canvas');
        can.setAttribute('id','triCanvas');
        can.setAttribute('width','300');
        can.setAttribute('height','300');
        document.body.appendChild(can);

        
        const canvas = document.getElementById('triCanvas');
        const ctx = canvas.getContext('2d');

        // إعدادات اللوحة
        const width = canvas.width;
        const height = canvas.height;

        // مركز اللوحة
        const centerX = width / 2;
        const centerY = height / 2;

        // إعدادات المثلثات
        const sizes = [140, 70, 35]; // أحجام المثلثات
        const colors = ['#ffd52d', 'crimson', '#ffff']; // ألوان المثلثات
        const rotations = [0, 0, 0]; // زوايا الدوران لكل مثلث
        const speed = 0.1;

        // دالة لرسم مثلث
        function drawTriangle(size, rotation, color) {
                ctx.fillStyle = color;
                ctx.beginPath();
    
                for (let i = 0; i < 3; i++) {
                     const angle = rotation + (i * 2 * Math.PI) / 3; // توزيع الزوايا
                     const x = centerX + size * Math.cos(angle);
                     const y = centerY + size * Math.sin(angle);
                     ctx.lineTo(x, y);
                     }
    
                ctx.closePath();
                ctx.fill();
        }


        // دالة لتحديث الرسمة
        function draw() {
                ctx.clearRect(0, 0, width, height); // مسح اللوحة
    
                // رسم كل مثلث وتحديث زاويته
                for (let i = 0; i < sizes.length; i++) {
                drawTriangle(sizes[i], rotations[i], colors[i]);
                // تحديث زاوية الدوران
                rotations[i] += (i % 2 === 0 ? -speed : speed); // عكس الدوران بين المثلثات
                }

                requestAnimationFrame(draw); // تحديث الرسمة
        }


        // بدء الرسم
        //draw();
        setTimeout(function(){canvas.remove()},0);





    </script>
