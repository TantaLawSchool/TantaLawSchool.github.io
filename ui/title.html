<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./3rdparty/fontawesome-free-6.7.2-web/css/all.min.css"/>
    <script src="./assets/js/watchCore.js" charset="UTF-8" type="text/javascript"></script>
    <title>Title</title>
    <style>
         /* === تعريف الخط المخصص === */
         @font-face {
            font-family: 'MyBoldFont';
            /* تأكد من صحة المسار للخط */
            src: url('./assets/fonts/bold.ttf') format('truetype');
            font-weight: normal; /* أو 700 إذا كان غامقًا فقط */
            font-style: normal;
        }

        :root {
            --watchCore-bg: #101820;              /* خلفية داكنة أزرق رمادي */
            --watchCore-navbar: #1b2a41;          /* شريط تنقل أزرق داكن مع تدرجات */
            --watchCore-card: #27333f;            /* بطاقات بلون أزرق رمادي غامق */
            --watchCore-primary: #1e90ff;         /* أزرق كهربائي مميز */
            --watchCore-primary-hover: #4682b4;   /* أزرق متوسط عند المرور */
            --watchCore-text: #f0f8ff;            /* أبيض خفيف، هادئ للعين */
            --watchCore-text-muted: #b0c4de;      /* نص ثانوي أزرق باهت */
            --watchCore-border: #2c3e50;          /* حدود داكنة مزرقّة */
            --desktop-left-right-margin: 200px;
        }
        
        /* === تنسيقات أساسية === */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;

            scrollbar-width: thin; /* Firefox */
            scrollbar-color: var(--watchCore-primary) var(--watchCore-navbar); /* Firefox */
        }

        /* تخصيص شريط التمرير لـ WebKit (Chrome, Safari) */
        ::-webkit-scrollbar {
             width: 8px;
             height: 8px; /* لشريط التمرير الأفقي */
         }
         ::-webkit-scrollbar-track {
             background: var(--watchCore-navbar);
             border-radius: 4px;
         }
         ::-webkit-scrollbar-thumb {
             background-color: var(--watchCore-primary);
             border-radius: 4px;
             border: 2px solid var(--watchCore-navbar); /* لخلق بعض المساحة */
         }
         ::-webkit-scrollbar-thumb:hover {
             background-color: var(--watchCore-primary-hover);
         }


        /* html */
        html {
            font-size: 16px; /* أساس حجم الخط */
        }

        body {
            font-family: 'MyBoldFont', sans-serif; /* تطبيق الخط المخصص */
            background-color: var(--watchCore-bg);
            color: var(--watchCore-text);
            line-height: 1.6;
            padding-top: 5px;
            padding-bottom: 40px;
        }

        /* === حاوية التفاصيل الرئيسية === */
        .title-details-container {
            max-width: 900px; /* أقصى عرض للمحتوى */
            margin: 0 auto; /* توسيط الحاوية */
            padding: 20px;
            background-color: var(--watchCore-card);
            border-radius: 8px;
            border: 1px solid var(--watchCore-border);
            display: flex;
            direction: rtl;
            flex-direction: column; /* تخطيط عمودي افتراضي للهواتف */
            gap: 20px; /* مسافة بين العناصر */
        }

        /* === البوستر === */
        .poster-container {
            text-align: center; /* توسيط البوستر في الوضع العمودي */
        }

        .title-poster {
            max-width: 150px; /* أقصى عرض للبوستر */
            width: 100%; /* يأخذ العرض المتاح حتى 200px */
            height: auto;
            border-radius: 6px;
            border: 2px solid var(--watchCore-border);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            margin-bottom: 15px; /* مسافة سفلية في الوضع العمودي */
        }

        /* === معلومات الفيلم (النص) === */
        .title-info {
            flex: 1; /* يأخذ المساحة المتبقية في الوضع الأفقي */
        }

        .title-title {
            font-size: 1.8rem;
            color:white;
            margin-bottom: 15px;
        }

        .title-meta {
            display: flex;
            flex-wrap: wrap; /* السماح بالالتفاف في الشاشات الصغيرة */
            gap: 15px; /* مسافة بين عناصر الميتا */
            margin-bottom: 20px;
            color: var(--watchCore-text-muted);
            font-size: 0.95rem;
        }

        .title-meta span {
            display: flex;
            align-items: center;
            gap: 5px; /* مسافة بين الأيقونة والنص */
        }

        .title-meta i {
            color: var(--watchCore-primary); /* لون الأيقونات */
        }

        .title-genres span {
            background-color: var(--watchCore-border);
            padding: 3px 8px;
            border-radius: 4px;
            color: var(--watchCore-text);
            font-size: 0.85rem;
        }

        /* === أزرار الإجراءات === */
        .action-buttons {
            display: flex;
            flex-wrap: wrap; /* التفاف الأزرار عند الحاجة */
            gap: 10px;
            margin-bottom: 25px;
        }

        .action-buttons button {
            padding: 10px 18px;
            background-color: var(--watchCore-primary);
            color: var(--watchCore-text);
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'MyBoldFont', sans-serif; /* تطبيق الخط على الأزرار */
            font-size: 0.9rem;
            transition: background-color 0.3s ease, transform 0.1s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .action-buttons button:hover {
            background-color: var(--watchCore-primary-hover);
            transform: translateY(-1px); /* تأثير رفع بسيط عند المرور */
        }

        .action-buttons button i {
            font-size: 1em; /* حجم الأيقونة متناسب مع الزر */
        }

        /* === الوصف === */
        .description-section h2 {
            font-size: 1.3rem;
            color: var(--watchCore-text);
            margin-bottom: 10px;
            padding-bottom: 5px;
            border-bottom: 1px solid var(--watchCore-border);
        }

        .title-description {
            color: var(--watchCore-text-muted);
            font-size: 0.95rem;
            text-align: justify; /* ضبط النص */
        }

         /* === رسالة الخطأ === */
         #error-message {
            display: none; /* مخفية افتراضيًا */
            color: #ff6b6b; /* لون أحمر للخطأ */
            text-align: center;
            padding: 30px;
            font-size: 1.2rem;
            background-color: var(--watchCore-card);
            border: 1px solid var(--watchCore-border);
            border-radius: 8px;
            max-width: 500px;
            margin: 20px auto;
         }

        /* === التجاوب مع الشاشات الأكبر (سطح المكتب) === */
        @media (min-width: 768px) {
            .title-details-container {
                flex-direction: row; /* تخطيط أفقي للشاشات الأكبر */
                align-items: flex-start; /* محاذاة العناصر للأعلى */
                gap: 30px; /* زيادة المسافة بين البوستر والمعلومات */
            }

            .poster-container {
                 text-align: right; /* محاذاة لليمين في الوضع الأفقي (بسبب dir=rtl) */
                 margin-bottom: 0; /* إزالة المسافة السفلية */
            }

            .title-poster {
                 margin-bottom: 0; /* إزالة المسافة السفلية للبوستر نفسه */
            }

            .title-title {
                font-size: 2.2rem;
            }

            .action-buttons button {
                 font-size: 1rem;
                 padding: 12px 22px;
            }
        }

        




        #seasons-container{
            visibility:hidden;
            position: relative;
            height: 50px;

            
            max-width: 900px;
            margin: 0 auto;
            margin-top: 5px;

            border-radius: 10px;
            &:after{
              content: '\25bc';
              font-size:25px;
              width:50px;
              height:30px;
              position : absolute;
              background-color:var(--watchCore-primary);
              color:var(--watchCore-text);
              left:20px;
              top:50%;
              transform: translate(0%,-50%);
              text-align:center;
              border-radius: 10px;
      
            }
        }
        
        #seasons{
            position: relative;
            height: 100%;
            width: 100%;
            border-radius: 10px;
            border: none;
            font-size:25px;
            padding:0 10px;
            position : relative;
            color: var(--watchCore-text);
            background-color: var(--watchCore-card);
            direction: rtl;
            -webkit-appearance:none;
            -moz-appearance:none;
            appearance:none;
            
        }
        #seasons option:checked{
            background-color: var(--watchCore-primary);
            color: var(--watchCore-text);
        }
        
        #episodes{
            visibility:hidden;
            position: relative;
            
            max-width: 900px;
            margin: 0 auto;
            margin-top: 5px;

            height: 225px;
            /* 150,225 */
            display: flex;
            flex-direction:row;
            flex-wrap: nowrap;
            overflow-x:scroll; /*make scrollable*/
            overflow-y: hidden;
            gap: 5px;

        }
        

        .episode{
            position: relative;
            width: 150px; 
            height: 225px;
            transition: 0.5s ease all;
            background-color:var(--watchCore-card);
            flex-grow: 0;
            flex-shrink: 0;
            cursor: pointer;
        }
        .episode img{
            position: absolute;
            width: 150px;
            height: 225px;
        }
        .episode:active{
            scale:0.95;
        }
        .episode .epiLabel{
            position: absolute;
            top:0%;
            right:0%;
            width: 50px;
            height:25px;
            color:var(--watchCore-text);
            font-family: 'MyBoldFont';
            background-color:var(--watchCore-navbar);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .episode .episodeNumber{
            position: absolute;
            top:50%;
            left:50%;
            transform: translate(-50%,-50%);
            font-size: 25px;
            font-weight: 600;
            color: var(--watchCore-text);
            background-color: var(--watchCore-navbar);
            padding: 5px 10px;
            border-radius: 10px;
        }
        .episode.selected{
            .episodeNumber{
                background-color: var(--watchCore-primary);
                color:var(--watchCore-text);
            }
        }














        .videoPlayerEnvironment{
            position: absolute;
            top:0%;
            bottom: 0%;
            left:0%;
            right:0%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .videoPlayer{
            width: 90%;
            max-width: 600px;
            background: #111111;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        .videoPlayer video{
            width: 100%;
            height: auto;
            border-radius: 10px;
            outline: none;
        }
        .videoPlayer h2{
            margin-bottom: 10px;
            font-size: 18px;
            color: #333;
        }
    
        
  




        @media screen and (max-width: 600px) {
          
            #seasons{
                font-size: 18px;
            }
            #episodes{
                height: 210px;
            }
            .episode{
                width: 140px;
                height:210px;
            }
            .episode img{
                position: absolute;
                width: 140px;
                height: 210px;
            }
        }
       
    </style>
</head>
<body>
    <script>
        function $(id){return document.getElementById(id);}
    </script>

    <div id="title-details-container" class="title-details-container">
        <!-- سيتم ملء هذا القسم بواسطة JavaScript -->
        <div class="poster-container">
            <img id="title-poster" src="" alt="بوستر الفيلم" class="title-poster">
        </div>
        <div class="title-info">
            <h1 id="title-title" class="title-title"></h1>
            <div class="title-meta">
                <span id="rating-info"><i class="fas fa-star"></i> <span id="title-rating"></span></span>
                <span id="year-info"><i class="fas fa-calendar-alt"></i> <span id="title-year"></span></span>
                <span id="genres-info" class="title-genres">
                    <!-- التصنيفات سيتم إضافتها هنا -->
                </span>
            </div>
            <div class="action-buttons">
                <button id="fav-button" onclick=""><i class="fas fa-heart"></i> أضف للمفضلة</button>
                <button id="play-button" onclick="Play()"><i class="fas fa-play"></i> تشغيل</button>
                <button id="download-button" onclick="Download()"><i class="fas fa-download"></i> تنزيل</button>
            </div>
            <div class="description-section">
                <h2><i class="fas fa-info-circle"></i> الوصف</h2>
                <p id="title-description" class="title-description"></p>
            </div>
        </div>
    </div>

    <!-- حاوية رسالة الخطأ -->
    <div id="error-message"></div>
    
   




    <div id="seasons-container">
        <select id="seasons" onchange="changeSeason();">
            
        </select>
    </div>

    <div id="episodes">

    </div>
    
    
    
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const urlParams = new URLSearchParams(window.location.search);
            const Id = urlParams.get("id");
            
            if (!Id) {
                
                return;
            }
            
           
            
            fetch(`/data/item/${Id}.json`)
                .then(response => response.json())
                .then(data => {
                    let title_element = document.createElement("script");
                    title_element.type = "application/json";
                    title_element.id = "title";
                    data["id"]=Id;
                    title_element.textContent = JSON.stringify(data);
                    document.body.appendChild(title_element);
                    drawTitle("title");
                    
                })
                .catch(error => {
                    console.log(error);
                    // إخفاء حاوية التفاصيل وإظهار رسالة الخطأ
                    $("title-details-container").style.display = 'none';
                    $("error-message").textContent = Id
                         ? `عفواً، لم يتم العثور على فيلم أو مسلسل بالمعرف ID: ${Id}`
                         : 'لم يتم تحديد معرف الفيلم أو المسلسل في الرابط.';
                    $("error-message").style.display = 'block';
                });
        });


        function drawTitle(t){
            const posterElement = $('title-poster');
            const titleElement = $('title-title');
            const ratingElement = $('title-rating');
            const yearElement = $('title-year');
            const genresElement = $('genres-info');
            const descriptionElement = $('title-description');
            const favButton = $('fav-button');
            const playButton = $('play-button');
            const downloadButton = $('download-button');
            const detailsContainer = $('title-details-container');
            const errorMessageElement = $('error-message');
            const ratingInfoElement = $('rating-info');
            const yearInfoElement = $('year-info');

            title = JSON.parse($(t).textContent);

            // إخفاء رسالة الخطأ (إذا كانت ظاهرة) وإظهار التفاصيل
            $("error-message").style.display = 'none';

            //posterElement.src = `/data/media/${title.id}.jpg`;
            posterElement.src = title.poster;
            posterElement.alt = `بوستر ${title.title}`;
            titleElement.textContent = title.title;
            ratingElement.textContent = title.rating;
            yearElement.textContent = title.year;
            descriptionElement.textContent = title.description;

            genresElement.innerHTML = ''; // مسح التصنيفات القديمة
            title.genre.forEach(genre => { // أخذ أول 3 تصنيفات فقط
                    const genreSpan = document.createElement('span');
                    genreSpan.textContent = i18n.translate(genre);
                    genresElement.appendChild(genreSpan);
                });
            


            if(title.type=="Arabic-TVSeries" || title.type=="Foreign-TVSeries"){
                $("seasons-container").style.visibility="visible";
                $("episodes").style.visibility="visible";

                options_template = ``;
                option_t = ``;
                for (var i=1;i<=Number(title.seasonsCount);i++){
                    if(i==Number(localStorageManager.getResume(title.id)["season"])){
                        option_t = `<option value="${i}" episodes="${title["seasonEpisodes"][i]}" selected> الموسم ${i} </option>`;
                    }else {
                        option_t = `<option value="${i}" episodes="${title["seasonEpisodes"][i]}"> الموسم ${i} </option>`;
                    }
                    options_template = options_template + option_t;
                }
                $("seasons").innerHTML=options_template;
                drawEpisodes(Number(title.seasonEpisodes[localStorageManager.getResume(title.id)["season"]]),Number($("seasons").options[$("seasons").selectedIndex].getAttribute("value")));


            }else if(title.type=="Arabic-Movie" || title.type=="Foreign-Movie"){
                $("seasons-container").remove();
                $("episodes").remove();

            }
           }
        
        function changeSeason(){
            drawEpisodes(Number($("seasons").options[$("seasons").selectedIndex].getAttribute("episodes")),Number($("seasons").options[$("seasons").selectedIndex].getAttribute("value")));
        }
        function drawEpisodes(n,for_season){
            $("episodes").innerHTML="";
            for(var i=1;i<=n;i++){
                div = document.createElement("div");
                div.setAttribute("class","episode");
                if(i==Number(localStorageManager.getResume(title.id)["episode"]) && for_season==Number(localStorageManager.getResume(title.id)["season"])){
                    div.classList.add('selected');
                }
                div.setAttribute("id",i);
                div.setAttribute("onclick","chooseEpisode(this)");
                div.innerHTML = `
                        <!--<img src="/data/media/${JSON.parse($("title").textContent).id}.jpg"></img>-->
                        <img src="${JSON.parse($("title").textContent).poster}"></img>
                        <div class="epiLabel">الحلقة</div>
                        <div class="episodeNumber">${i}</div>
                   `;

                $("episodes").appendChild(div);

                    }
            $("episodes").scrollLeft = 0;
            if(for_season==Number(localStorageManager.getResume(title.id)["season"])){
                $("episodes").scrollBy({
                  left:150*(Number(localStorageManager.getResume(title.id)["episode"])-1),
                  behavior:"smooth"
                });

            }
            

        }
        function chooseEpisode(e){
            e.classList.toggle('selected');
            document.querySelectorAll('.episode').forEach(el => el.classList.remove('selected'));
            e.classList.add('selected');
        }

        function buildPlayEnvironment(id,season,episode){
            div = document.createElement("div");
            div.setAttribute("class","videoPlayerEnvironment");
            div.setAttribute("id","videoPlayerEnvironment");
            div.innerHTML = `
                <div class="videoPlayer">
                    <h2>${id}/${season}/${episode}</h2>
                    <video controls>
                        <source src="https://flawtantaedu-my.sharepoint.com/personal/ug_31146395_f-law_tanta_edu_eg/_layouts/15/download.aspx?SourceUrl=/personal/ug_31146395_f-law_tanta_edu_eg/Documents/d/${id}/${season}/${episode}" type="video/mp4">
                    </video>
                </div>
            
            `;
            document.body.appendChild(div);



        }


        function Play(){
            title = JSON.parse($("title").textContent);
            if(title.type=="Arabic-TVSeries" || title.type=="Foreign-TVSeries"){
                
                if(document.querySelector(".episode.selected")){
                    season = $("seasons").value;
                    episode = document.querySelector(".episode.selected").id;
                    localStorageManager.setResume(title.id,season,episode);
                }else{
                    for(var i=0;i<$("seasons").options.length;i++){
                        $("seasons").options[i].selected = false;
                    }
                    for(var i=0;i<$("seasons").options.length;i++){
                        if(Number($("seasons").options[i].value) == Number(localStorageManager.getResume(title.id)["season"])) {
                            $("seasons").options[i].selected = true;
                            break;
                        }
                            
                    }
                    $("seasons").dispatchEvent(new Event('change'));
                    season = $("seasons").value;
                    episode = document.querySelector(".episode.selected").id;


                }
                console.log("Play");
                console.log(season,episode);
                buildPlayEnvironment(title.id,season,episode);

                

            }else if(title.type=="Arabic-Movie" || title.type=="Foreign-Movie"){

            }


        }

        function Download(){
            title = JSON.parse($("title").textContent);
            if(title.type=="Arabic-TVSeries" || title.type=="Foreign-TVSeries"){
                if(document.querySelector(".episode.selected")){
                    season = $("seasons").value;
                    episode = document.querySelector(".episode.selected").id;
                    localStorageManager.setResume(title.id,season,episode);
                }else{
                    for(var i=0;i<$("seasons").options.length;i++){
                        $("seasons").options[i].selected = false;
                    }
                    for(var i=0;i<$("seasons").options.length;i++){
                        if(Number($("seasons").options[i].value) == Number(localStorageManager.getResume(title.id)["season"])) {
                            $("seasons").options[i].selected = true;
                            break;
                        }
                            
                    }
                    $("seasons").dispatchEvent(new Event('change'));
                    season = $("seasons").value;
                    episode = document.querySelector(".episode.selected").id;


                }
                console.log("Download");
                console.log(season,episode);
                
            }else if(title.type=="Arabic-Movie" || title.type=="Foreign-Movie"){

            }

        }

        



    </script>
</body>
</html>
