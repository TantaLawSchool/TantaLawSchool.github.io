<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>play turn on</title>
    <style>

        body{
            background-color: #271f17;
            display: flex;
            justify-content: center;
        }

        #mainC{
            position: relative;
            height: 223.60679774997897px ;
            width: 300px;
            margin-top: 200px;
        }
       

        .playContainer{
            position: absolute;
            top:50%;
            left:50%;
            width: 200px;
            height: 100px;
            border-radius: 1em;
            transform: translate(-50%,-50%)rotate(-45deg);
        }

        .upRightSpace{
            position: absolute;
            top:0%;
            right:0%;
            width: 80%;
            height: 50%;
            border-radius: 1em;
            background-color: #ffd52d;
            /*animation: ani1 1s infinite;*/
        }

        .downLeftSpace{
            position: absolute;
            top:50%;
            left:0%;
            width: 80%;
            height: 50%;
            border-radius: 1em;
            background-color: red;
            /*animation: ani2 1s infinite;*/
        }

       

             
       
        @keyframes ani1 {

            50%{
                right:20%;
            }
            100%{
                right: 0%;
            }
            
        }

        @keyframes ani2 {

            50%{
                left:20%;
            }
            100%{
                left: 0%;
            }

        }

       
       


    </style>
</head>

<body>
    

    <div id="mainC">

    <div class = "playContainer">
        <div class = "upRightSpace">

        </div>
        <div class = "downLeftSpace">

        </div>

    </div>

    </div>



    <script>
    

    
    </script>


</body>
</html>
