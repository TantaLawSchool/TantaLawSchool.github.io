

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تشغيل فيديو عبر Chunks</title>
</head>
<body>
    <video id="video" controls></video>
    <script>
        // الروابط الخاصة بكل Chunk
        const chunkUrls = [
            'SampleVideo.mp4_chunk_1',
            'SampleVideo.mp4_chunk_2',
            'SampleVideo.mp4_chunk_3',
            'SampleVideo.mp4_chunk_4',
            'SampleVideo.mp4_chunk_5',
            'SampleVideo.mp4_chunk_6',
            'SampleVideo.mp4_chunk_7',
            'SampleVideo.mp4_chunk_8',
            'SampleVideo.mp4_chunk_9',
            'SampleVideo.mp4_chunk_10'
        ];

        const videoElement = document.getElementById('video');
        const mediaSource = new MediaSource();
        videoElement.src = URL.createObjectURL(mediaSource);

        let sourceBuffer;
        let currentChunk = 0;

        mediaSource.addEventListener('sourceopen', () => {
            sourceBuffer = mediaSource.addSourceBuffer('video/mp4;');
            sourceBuffer.addEventListener('updateend', onUpdateEnd);
            loadChunks();
        });

        function loadChunks() {
            if (currentChunk < chunkUrls.length) {
                fetchChunk(chunkUrls[currentChunk]);
            } else {
                // تأكد من أن جميع الـ chunks تم تحميلها قبل استدعاء endOfStream
                mediaSource.endOfStream();
                videoElement.play();
            }
        }

        function fetchChunk(url) {
            fetch(url)
                .then(response => response.arrayBuffer())
                .then(data => {
                    // إضافة الـ chunk إلى الـ video
                    sourceBuffer.appendBuffer(data);
                })
                .catch(error => {
                    console.error("حدث خطأ أثناء تحميل الـ chunk:", error);
                });
        }

        function onUpdateEnd() {
            if (currentChunk < chunkUrls.length) {
                currentChunk++;
                loadChunks();
            }
        }
    </script>
</body>
</html>
