<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js - تسجيل شفاف ثلاثي الأبعاد</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-image: 
                linear-gradient(45deg, #111 25%, transparent 25%), 
                linear-gradient(-45deg, #111 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #111 75%), 
                linear-gradient(-45deg, transparent 75%, #111 75%);
            background-size: 20px 20px;
            background-color: #050505;
        }

        #canvas-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        .controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            background: rgba(255, 255, 255, 0.1);
            padding: 12px 20px;
            border-radius: 50px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            z-index: 100;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 25px;
            background: #00d4ff;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover { transform: scale(1.05); background: #fff; }

        button.recording { background: #ff4444; color: white; animation: pulse 1.5s infinite; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }

        #status-msg {
            position: fixed;
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            background: #fff;
            color: #000;
            padding: 12px 30px;
            border-radius: 30px;
            transition: top 0.5s ease;
            z-index: 1000;
        }
    </style>
</head>
<body>

    <div id="status-msg">رسالة الحالة</div>

    <div id="canvas-container"></div>

    <div class="controls">
        <button id="recordBtn">تسجيل 3D شفاف</button>
        <button id="impactBtn" style="background: #ffb703;">تفعيل الاصطدام</button>
    </div>

    <script>
        let scene, camera, renderer, mediaRecorder;
        let recordedChunks = [];
        let isRecording = false;
        let cube1, cube2, particles = [];
        let hasCollided = false;

        const recordBtn = document.getElementById('recordBtn');
        const impactBtn = document.getElementById('impactBtn');
        const statusMsg = document.getElementById('status-msg');

        function initThree() {
            // المشهد مع خلفية شفافة
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 10;

            renderer = new THREE.WebGLRenderer({ 
                antialias: true, 
                alpha: true, // تفعيل الشفافية في Three.js
                preserveDrawingBuffer: true // ضروري لالتقاط الإطارات بدقة
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(0x000000, 0); // لون شفاف تماماً
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // إضاءة
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);
            const pointLight = new THREE.PointLight(0x00d4ff, 1);
            pointLight.position.set(5, 5, 5);
            scene.add(pointLight);

            createObjects();
            animate();
        }

        function createObjects() {
            const geometry = new THREE.BoxGeometry(2, 2, 2);
            const material1 = new THREE.MeshPhongMaterial({ color: 0x00d4ff });
            const material2 = new THREE.MeshPhongMaterial({ color: 0xff4646 });

            cube1 = new THREE.Mesh(geometry, material1);
            cube2 = new THREE.Mesh(geometry, material2);

            resetSimulation();
            scene.add(cube1);
            scene.add(cube2);
        }

        function resetSimulation() {
            hasCollided = false;
            cube1.position.set(-15, 0, 0);
            cube2.position.set(15, 0, 0);
            cube1.visible = true;
            cube2.visible = true;
            
            // تنظيف الجزيئات القديمة
            particles.forEach(p => scene.remove(p.mesh));
            particles = [];
        }

        function createExplosion(pos, color) {
            const particleCount = 100;
            const geo = new THREE.BoxGeometry(0.2, 0.2, 0.2);
            const mat = new THREE.MeshPhongMaterial({ color: color });

            for (let i = 0; i < particleCount; i++) {
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.copy(pos);
                scene.add(mesh);

                particles.push({
                    mesh: mesh,
                    velocity: new THREE.Vector3(
                        (Math.random() - 0.5) * 0.5,
                        (Math.random() - 0.5) * 0.5,
                        (Math.random() - 0.5) * 0.5
                    ),
                    life: 1.0
                });
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            if (!hasCollided) {
                cube1.position.x += 0.2;
                cube2.position.x -= 0.2;
                cube1.rotation.y += 0.05;
                cube2.rotation.y -= 0.05;

                if (cube1.position.x >= -0.5) {
                    hasCollided = true;
                    cube1.visible = false;
                    cube2.visible = false;
                    createExplosion(cube1.position, 0x00d4ff);
                    createExplosion(cube2.position, 0xff4646);
                }
            }

            // تحديث الجزيئات
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.mesh.position.add(p.velocity);
                p.mesh.rotation.x += 0.1;
                p.life -= 0.01;
                p.mesh.scale.set(p.life, p.life, p.life);

                if (p.life <= 0) {
                    scene.remove(p.mesh);
                    particles.splice(i, 1);
                }
            }

            renderer.render(scene, camera);
        }

        // تفاعل الماوس لتدوير الكاميرا
        window.addEventListener('mousemove', (e) => {
            if (!isRecording) {
                camera.position.x = (e.clientX - window.innerWidth / 2) * 0.02;
                camera.position.y = -(e.clientY - window.innerHeight / 2) * 0.02;
                camera.lookAt(scene.position);
            }
        });

        // كود التسجيل الشفاف (WebM Alpha)
        async function startRecording() {
            recordedChunks = [];
            resetSimulation();
            
            const stream = renderer.domElement.captureStream(60);
            const supportedType = [
                'video/webm;codecs=vp9,alpha=1',
                'video/webm;codecs=vp9',
                'video/webm;codecs=vp8,alpha=1',
                'video/webm;codecs=vp8',
                'video/webm'
            ].find(type => MediaRecorder.isTypeSupported(type));
            
            console.log(supportedType);
            mediaRecorder = new MediaRecorder(stream, { mimeType: supportedType });

            mediaRecorder.ondataavailable = (e) => {
                if (e.data.size > 0) recordedChunks.push(e.data);
            };

            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: supportedType });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'threejs-transparent.webm';
                a.click();
                showStatus("تم حفظ الفيديو الشفاف!");
            };

            mediaRecorder.start();
            isRecording = true;
            recordBtn.textContent = "إيقاف وحفظ";
            recordBtn.classList.add('recording');
            showStatus("جاري التسجيل بدقة 3D...");
        }

        recordBtn.addEventListener('click', () => {
            if (!isRecording) startRecording();
            else {
                mediaRecorder.stop();
                isRecording = false;
                recordBtn.textContent = "تسجيل 3D شفاف";
                recordBtn.classList.remove('recording');
            }
        });

        impactBtn.addEventListener('click', resetSimulation);

        function showStatus(text) {
            statusMsg.textContent = text;
            statusMsg.style.top = '20px';
            setTimeout(() => statusMsg.style.top = '-100px', 3000);
        }

        window.onload = initThree;
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
