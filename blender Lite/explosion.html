<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js GLB Explosion</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- تحميل GLTFLoader من مستودع Three.js الرسمي -->
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/loaders/GLTFLoader.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505;
            color: white;
            font-family: sans-serif;
        }

        #loading-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 0.5s;
        }

        .loader {
            border: 4px solid #333;
            border-top: 4px solid #ff4400;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        #ui {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            pointer-events: none;
        }

        .btn-trigger {
            pointer-events: auto;
            background: #ff4400;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 18px;
            cursor: pointer;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(255, 68, 0, 0.4);
        }
    </style>
</head>
<body>

    <div id="loading-screen">
        <div class="loader"></div>
        <p id="status">جاري تحميل نموذج الانفجار...</p>
    </div>

    <div id="ui">
        <button class="btn-trigger" onclick="playExplosion()">إعادة تشغيل الانفجار</button>
    </div>

    <script>
        let scene, camera, renderer, clock, mixer;
        const modelPath = 'timeframe_explosion(1).glb'; // تأكد من وجود الملف في نفس المجلد

        function init() {
            // 1. إعداد المشهد
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a0a);
            clock = new THREE.Clock();

            // 2. الكاميرا
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(10, 5, 10);
            camera.lookAt(0, 5, 0);

            // 3. المحرك
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.outputEncoding = THREE.sRGBEncoding;
            document.body.appendChild(renderer.domElement);

// إظهار المحاور (X: أحمر، Y: أخضر، Z: أزرق)
            // الرقم 5 يحدد طول خط المحور
            const axesHelper = new THREE.AxesHelper(5);
            scene.add(axesHelper);

            // إظهار شبكة أرضية اختيارية للمساعدة في تحديد المسافات
            const gridHelper = new THREE.GridHelper(20, 20, 0x444444, 0x222222);
            scene.add(gridHelper);
            
            // 4. الإضاءة
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(0xffaa00, 2, 100);
            pointLight.position.set(10, 10, 10);
            scene.add(pointLight);





// --- تحميل صورة PNG وجعلها تدور ---
            const textureLoader = new THREE.TextureLoader();
            textureLoader.load("sprite.png", function(texture) {
                // إنشاء هندسة مستوية للصورة
                const geometry = new THREE.PlaneGeometry(3, 3);
                const material = new THREE.MeshBasicMaterial({ 
                    map: texture, 
                    transparent: true, 
                    side: THREE.DoubleSide 
                });
                pngMesh = new THREE.Mesh(geometry, material);
                
                // وضعها في مكان مرتفع قليلاً عن المركز
                pngMesh.position.set(3, 0, 3); 
                scene.add(pngMesh);
            });










            // 5. تحميل النموذج
            const loader = new THREE.GLTFLoader();
            loader.load(
                modelPath,
                function (gltf) {
                    const model = gltf.scene;
                    model.position.set(0, 0, 0);
                    scene.add(model);

                    // البحث عن الأنيميشن (مفاتيح الحركة)
                    if (gltf.animations && gltf.animations.length) {
                        mixer = new THREE.AnimationMixer(model);
                        
// تشغيل كل الحركات المتاحة (الانفجار)
                        gltf.animations.forEach((clip) => {
                        console.log(clip);
                        // تعديل الأنميشن ليعمل مرة واحدة فقط
                            mixer.clipAction(clip).setLoop(THREE.LoopOnce); 
                            // البقاء على آخر إطار عند الانتهاء (عدم العودة للبداية)
                            mixer.clipAction(clip).clampWhenFinished = true; 
                            mixer.clipAction(clip).setEffectiveTimeScale(10);
                            mixer.clipAction(clip).play();
                        });
                        
                        document.getElementById('status').innerText = "تم التحميل بنجاح!";
                    } else {
                        document.getElementById('status').innerText = "النموذج لا يحتوي على حركات مخزنة.";
                    }

                    // إخفاء شاشة التحميل
                    setTimeout(() => {
                        document.getElementById('loading-screen').style.opacity = '0';
                        setTimeout(() => document.getElementById('loading-screen').remove(), 500);
                    }, 1000);
                },
                function (xhr) {
                    const percent = Math.round((xhr.loaded / xhr.total) * 100);
                    document.getElementById('status').innerText = `جاري التحميل: ${percent}%`;
                },
                function (error) {
                    console.error('حدث خطأ في تحميل النموذج:', error);
                    document.getElementById('status').innerText = "فشل التحميل. تأكد من مسار الملف.";
                }
            );

            animate();
        }

        function playExplosion() {
            if (mixer) {
                mixer.stopAllAction();
                mixer._actions.forEach(action => {
                    action.reset();
                    action.play();
                });
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            
            const delta = clock.getDelta();
            
            // تحديث الأنيميشن في كل فريم
            if (mixer) {
                mixer.update(delta);
            }


 // --- تدوير الصورة حول نفسها ---
            if (pngMesh) {
                pngMesh.rotation.y += 0.02; // الدوران حول المحور الرأسي
            }


            // دوران طفيف للكاميرا حول الانفجار
            const time = Date.now() * 0.0005;
            //camera.position.x = Math.sin(time) * 12;
            //camera.position.z = Math.cos(time) * 12;
            //camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        window.onload = init;
    </script>
</body>
</html>
