<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل فيديو شفاف (Alpha Channel)</title>
    <style>
        :root {
            --night-bg: #050510;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* خلفية شبكية لتمييز الشفافية أثناء العمل */
            background-image: 
                linear-gradient(45deg, #111 25%, transparent 25%), 
                linear-gradient(-45deg, #111 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #111 75%), 
                linear-gradient(-45deg, transparent 75%, #111 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            background-color: #050505;
        }

        #canvas-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        canvas {
            display: block;
        }

        .controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            background: rgba(255, 255, 255, 0.1);
            padding: 12px 20px;
            border-radius: 50px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            z-index: 100;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 25px;
            background: #00d4ff;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        button:hover {
            transform: scale(1.05);
            background: #fff;
        }

        button.recording {
            background: #ff4444;
            color: white;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }

        .instructions {
            position: absolute;
            top: 20px;
            color: white;
            text-align: center;
            width: 100%;
            font-size: 1.1rem;
            z-index: 10;
        }

        #status-msg {
            position: fixed;
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            background: #fff;
            color: #000;
            padding: 12px 30px;
            border-radius: 30px;
            transition: top 0.5s ease;
            z-index: 1000;
        }
    </style>
</head>
<body>

    <div id="status-msg">رسالة الحالة</div>

    <div class="instructions">
        تم تحديث محرك التسجيل ليتوافق مع متصفحك الحالي
    </div>

    <div id="canvas-container">
        <canvas id="skyCanvas"></canvas>
    </div>

    <div class="controls">
        <button id="recordBtn">ابدأ تسجيل الفيديو الشفاف</button>
        <button id="clearBtn" style="background: rgba(255,255,255,0.2); color: white;">مسح</button>
    </div>

    <script>
        const canvas = document.getElementById('skyCanvas');
        const ctx = canvas.getContext('2d', { alpha: true });
        const recordBtn = document.getElementById('recordBtn');
        const clearBtn = document.getElementById('clearBtn');
        const statusMsg = document.getElementById('status-msg');

        let width, height;
        let particles = [];
        let isRecording = false;
        let mediaRecorder;
        let recordedChunks = [];

        function init() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }

        window.addEventListener('resize', init);
        init();

        class Sparkle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 15 + 5;
                this.color = `hsla(${Math.random() * 360}, 100%, 70%, `;
                this.opacity = 1;
                this.vx = Math.random() * 4 - 2;
                this.vy = Math.random() * 4 - 2;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.opacity -= 0.01;
                this.size *= 0.98;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color + this.opacity + ')';
                ctx.fill();
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            particles.forEach((p, index) => {
                p.update();
                p.draw();
                if (p.opacity <= 0) particles.splice(index, 1);
            });
            requestAnimationFrame(animate);
        }

        window.addEventListener('mousemove', (e) => {
            for(let i=0; i<2; i++) {
                particles.push(new Sparkle(e.clientX, e.clientY));
            }
        });

        // وظيفة للتحقق من الصيغة المدعومة للشفافية
        function getSupportedMimeType() {
            const types = [
                'video/webm;codecs=vp9,alpha=1',
                'video/webm;codecs=vp9',
                'video/webm;codecs=vp8,alpha=1',
                'video/webm;codecs=vp8',
                'video/webm'
            ];
            for (let type of types) {
                if (MediaRecorder.isTypeSupported(type)) {
                    console.log(type);
                    return type;
                }
            }
            return '';
        }

        function startRecording() {
            recordedChunks = [];
            const stream = canvas.captureStream(60); 
            const mimeType = getSupportedMimeType();

            if (!mimeType) {
                showStatus("المتصفح لا يدعم تسجيل الفيديو من الكانفاس");
                return;
            }

            console.log("Using MIME type:", mimeType);
            
            try {
                mediaRecorder = new MediaRecorder(stream, { mimeType });
            } catch (e) {
                console.error("Recording error:", e);
                mediaRecorder = new MediaRecorder(stream);
            }

            mediaRecorder.ondataavailable = (e) => {
                if (e.data.size > 0) recordedChunks.push(e.data);
            };

            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'transparent-animation.webm';
                a.click();
                showStatus("تم حفظ الفيديو الشفاف بنجاح!");
            };

            mediaRecorder.start();
            isRecording = true;
            recordBtn.textContent = "إيقاف وحفظ التسجيل";
            recordBtn.classList.add('recording');
            showStatus("بدأ التسجيل (يدعم الشفافية)...");
        }

        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state !== "inactive") {
                mediaRecorder.stop();
            }
            isRecording = false;
            recordBtn.textContent = "ابدأ تسجيل الفيديو الشفاف";
            recordBtn.classList.remove('recording');
        }

        recordBtn.addEventListener('click', () => {
            if (!isRecording) startRecording();
            else stopRecording();
        });

        clearBtn.addEventListener('click', () => particles = []);

        function showStatus(text) {
            statusMsg.textContent = text;
            statusMsg.style.top = '20px';
            setTimeout(() => statusMsg.style.top = '-100px', 3000);
        }

        animate();
    </script>
</body>
</html>
